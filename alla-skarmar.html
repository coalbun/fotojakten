<title>Fotojakten – alla skärmar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #0F1A12;
    --bg-soft: #16241A;
    --card: #1D2E22;
    --card-hi: #26382B;
    --ink: #F2F5EF;
    --muted: #9BAE9E;
    --leaf: #4E9E5F;
    --leaf-bright: #6DC77C;
    --leaf-deep: #2F6B3E;
    --moss: rgba(109, 199, 124, 0.14);
    --sand: #E8E3D4;
    --berry: #E0705F;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --radius: 26px;
    --radius-lg: 32px;
    --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.36);
    --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.48);
    --glow: 0 8px 28px rgba(78, 158, 95, 0.34);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  :focus-visible {
    outline: 3px solid var(--leaf-bright);
    outline-offset: 3px;
    border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 700px 520px at 78% -6%, rgba(78, 158, 95, 0.22), transparent 62%),
      radial-gradient(ellipse 620px 460px at 6% 32%, rgba(45, 92, 58, 0.20), transparent 60%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16.5px;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 460px; margin: 0 auto; padding: 18px 16px 116px; }
  h1 { font-size: 2rem; line-height: 1.08; letter-spacing: -0.035em; font-weight: 700; }
  h2 { font-size: 1.32rem; line-height: 1.2; letter-spacing: -0.025em; font-weight: 700; }
  h3 { font-size: 1.06rem; font-weight: 700; letter-spacing: -0.015em; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .center { text-align: center; }
  .label {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--leaf-bright);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow-md);
    margin-top: 14px;
    position: relative;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(160deg, rgba(255,255,255,0.06), transparent 42%);
    pointer-events: none;
  }
  .card > * { position: relative; }
  .btn {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 999px;
    padding: 17px 20px;
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
    color: #08150C;
    background: linear-gradient(160deg, var(--leaf-bright), var(--leaf) 70%);
    box-shadow: var(--glow);
    cursor: pointer;
    text-align: center;
    transition: transform 0.14s cubic-bezier(.2,.9,.3,1), box-shadow 0.14s ease, filter 0.14s ease;
  }
  .btn:active { transform: scale(0.97); box-shadow: 0 3px 12px rgba(78,158,95,0.28); filter: brightness(0.96); }
  .btn.ghost {
    background: var(--card-hi); color: var(--ink);
    border: 1px solid var(--line-strong); box-shadow: var(--shadow-sm);
  }
  .btn.ghost:active { background: var(--card); }
  .btn.small { padding: 13px 22px; font-size: 0.92rem; width: auto; display: inline-block; }
  .btn.danger {
    background: transparent; color: var(--berry); border: 0;
    font-weight: 700; font-size: 0.9rem; box-shadow: none;
  }
  .btn.danger:active { transform: scale(0.97); }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }
  .btn .ic { display: inline-block; vertical-align: -5px; margin-right: 9px; width: 21px; height: 21px; }
  .stack > * + * { margin-top: 12px; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    font: inherit;
    padding: 13px 18px;
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    background: var(--bg-soft);
    color: var(--ink);
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  input::placeholder, textarea::placeholder { color: #8A9C8C; }
  input:focus, textarea:focus { outline: none; border-color: var(--leaf); background: var(--card-hi); }
  textarea { border-radius: 22px; line-height: 1.6; }
  label.field { display: block; font-weight: 600; font-size: 0.86rem; margin-top: 14px; margin-bottom: 6px; color: var(--muted); letter-spacing: 0.01em; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > .grow { flex: 1; }
  .nextstep {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--moss); color: var(--leaf-bright);
    border-radius: 999px; padding: 10px 18px;
    font-weight: 700; font-size: 0.86rem; margin-top: 14px;
  }
  .nextstep .ic { width: 16px; height: 16px; flex-shrink: 0; }

  .hero { text-align: center; padding-top: 40px; }
  .iconbadge {
    width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 50%;
    background: linear-gradient(160deg, var(--leaf-bright), var(--leaf-deep) 75%);
    box-shadow: var(--glow), inset 0 2px 4px rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center;
  }
  .iconbadge .ic { width: 36px; height: 36px; color: #08150C; stroke-width: 2; }
  .iconbadge.gold { background: linear-gradient(160deg, #F2D48A, #C79A3C 75%); box-shadow: 0 8px 28px rgba(199,154,60,0.36), inset 0 2px 4px rgba(255,255,255,0.4); }
  .codebig {
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    text-align: center;
    color: var(--ink);
    background: linear-gradient(160deg, var(--card-hi), var(--bg-soft));
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-lg);
    padding: 20px 8px 18px;
    margin: 16px 0 6px;
    box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.08);
    font-variant-numeric: tabular-nums;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card-hi);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 15px 5px 5px;
    font-weight: 700;
    font-size: 0.82rem;
    box-shadow: var(--shadow-sm);
  }
  .pill.tag {
    background: var(--moss); color: var(--leaf-bright); border-color: transparent; padding: 8px 16px;
  }
  .teamrow {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 2px; border-bottom: 1px solid var(--line);
  }
  .teamrow:last-child { border-bottom: 0; }
  .teamrow .members { color: var(--muted); font-size: 0.84rem; }
  .avatarpicker { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
  .avatarpreview {
    width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-soft); border: 1.5px dashed var(--line-strong);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    color: var(--leaf);
  }
  .avatarpreview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatarpreview .ic { width: 28px; height: 28px; }
  .countpill {
    font-variant-numeric: tabular-nums;
    font-weight: 800; font-size: 3rem; color: var(--ink);
    letter-spacing: -0.045em; line-height: 1;
  }
  .countpill.warn { color: var(--berry); }

  .micon {
    width: 76px; height: 76px; margin: 0 auto 12px; border-radius: 50%;
    background: linear-gradient(160deg, var(--card-hi), var(--bg-soft));
    border: 1px solid var(--line-strong);
    box-shadow: var(--shadow-md), inset 0 2px 6px rgba(255,255,255,0.07);
    font-size: 2.1rem; line-height: 74px; text-align: center;
  }
  .missioncard .mtitle { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; margin-top: 8px; line-height: 1.22; }
  .progressbar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; margin-top: 16px; }
  .progressbar > div { height: 100%; background: linear-gradient(90deg, var(--leaf-bright), var(--leaf)); border-radius: 99px; transition: width 1s linear; }
  .photogrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .photocell {
    position: relative; border-radius: 22px; overflow: hidden; background: var(--bg-soft);
    aspect-ratio: 3 / 4; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.16s ease, transform 0.16s cubic-bezier(.2,.9,.3,1);
  }
  .photocell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photocell.sel { box-shadow: 0 0 0 3px var(--leaf-bright), var(--glow); transform: translateY(-3px) scale(1.01); }
  .photocell .tag {
    position: absolute; left: 8px; bottom: 8px; right: 8px;
    display: flex; align-items: center; gap: 6px; justify-content: center;
    background: rgba(10, 18, 12, 0.66); color: #fff; font-size: 0.75rem; font-weight: 600;
    padding: 6px 10px; border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .photocell .votetag {
    position: absolute; top: 8px; right: 8px;
    background: var(--leaf-bright); color: #08150C; font-size: 0.8rem; font-weight: 800;
    padding: 4px 11px; border-radius: 999px;
    box-shadow: var(--shadow-sm);
    font-variant-numeric: tabular-nums;
  }
  .photocell.own img { opacity: 0.45; }
  .mysubmit { border-radius: 22px; overflow: hidden; margin-top: 14px; box-shadow: var(--shadow-md); cursor: pointer; }
  .mysubmit img { width: 100%; display: block; max-height: 34vh; object-fit: cover; }
  .tabs {
    position: fixed; bottom: 14px; left: 16px; right: 16px;
    background: rgba(29, 46, 34, 0.86);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    box-shadow: var(--shadow-lg);
    display: flex; max-width: 428px; margin: 0 auto;
    padding: 6px;
  }
  .tabs button {
    flex: 1; background: none; border: 0; font-family: inherit; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.01em; border-radius: 999px;
    color: var(--muted); padding: 10px 0 9px; cursor: pointer;
    transition: color 0.16s ease, background 0.16s ease;
  }
  .tabs button .ic { width: 21px; height: 21px; margin: 0 auto 4px; }
  .tabs button.on { color: #08150C; background: var(--leaf-bright); }
  .ic {
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; display: block;
  }
  .scorerow { display: flex; align-items: center; gap: 14px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .scorerow:last-child { border-bottom: 0; }
  .scorerow .pos { font-weight: 800; width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .scorerow .pts { margin-left: auto; font-weight: 800; font-size: 1.2rem; color: var(--leaf-bright); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 40;
    background-image: radial-gradient(ellipse 700px 520px at 50% -6%, rgba(78, 158, 95, 0.22), transparent 62%);
    overflow-y: auto; padding: 26px 16px 44px;
  }
  .overlay .inner { max-width: 460px; margin: 0 auto; }

  .finale > div { margin: auto 0; width: 100%; }
  .finale h2 { font-size: 1.6rem; letter-spacing: -0.03em; }
  .finale .label { color: var(--leaf-bright); }
  .finale .bignum {
    font-size: 3.4rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em;
    width: 96px; height: 96px; margin: 0 auto; border-radius: 50%;
    background: linear-gradient(160deg, var(--card-hi), var(--bg-soft));
    border: 1px solid var(--line-strong);
    color: var(--leaf-bright); display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg);
  }
  .finale .bigemoji { font-size: 3.4rem; line-height: 1; filter: drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  .finale img { max-width: min(86vw, 400px); max-height: 46vh; border-radius: 26px; margin: 20px 0 14px; box-shadow: var(--shadow-lg); }
  .finale .hint { position: fixed; bottom: 22px; left: 0; right: 0; font-size: 0.82rem; opacity: 0.5; letter-spacing: 0.02em; font-weight: 600; }
  .finale .wname { font-size: 2.15rem; font-weight: 800; letter-spacing: -0.035em; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .finale table { margin: 18px auto 0; border-collapse: collapse; color: var(--ink); }
  .finale td { padding: 9px 12px; font-size: 1.05rem; font-weight: 600; }
  .finale td.pts { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; color: var(--leaf-bright); }
  .mutebtn {
    position: fixed; top: 16px; right: 16px; z-index: 65;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line-strong); background: rgba(29, 46, 34, 0.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--ink); display: none; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow-md);
  }
  .mutebtn .ic { width: 19px; height: 19px; }
  .mutebtn.showme { display: flex; }
  .dropfx {
    position: fixed; inset: 0; z-index: 55; color: var(--ink);
    background:
      radial-gradient(ellipse 620px 520px at 50% 34%, rgba(78, 158, 95, 0.34), transparent 64%),
      radial-gradient(90% 70% at 50% 40%, #14261A 0%, #08120B 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px; animation: fxfade 0.25s ease;
  }
  .dropfx .dicon {
    width: 112px; height: 112px; line-height: 110px; font-size: 4.4rem;
    border-radius: 50%; background: linear-gradient(160deg, var(--card-hi), var(--bg-soft));
    border: 1px solid var(--line-strong);
    box-shadow: var(--shadow-lg), 0 0 60px rgba(78,158,95,0.3);
    animation: springin 0.7s cubic-bezier(0.2, 1.6, 0.35, 1);
  }
  .dropfx .dlabel { margin-top: 26px; color: var(--leaf-bright); }
  .dropfx .dtitle { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.03em; margin-top: 10px; max-width: 320px; animation: riseup 0.5s 0.15s ease backwards; }
  @keyframes springin { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes riseup { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fxfade { from { opacity: 0; } to { opacity: 1; } }
  .countpill.warn { animation: urgent 1s ease-in-out infinite; }
  @keyframes urgent { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .progressbar.warn > div { background: linear-gradient(90deg, #EE8B7B, var(--berry)); }

  var ovl = el("ovl");
  ovl.innerHTML = html;
  makeKeyboardReachable(ovl);
}

var VIEW = "home";

function render() {
  if (VIEW === "home") return renderHome();
  if (VIEW === "create") return renderCreate();
  if (!S.data) return;
  var ph = phase();
  if (ph.name === "lobby" || ph.name === "prestart") return renderLobby(ph);
  if (ph.name === "finale") { renderGame(ph); openFinale(); return; }
  renderGame(ph);
}

function renderLobby(ph) {

  var html = "";

  html += '<div class="center" style="padding-top:18px">' +
    '<span class="pill tag">Väntar på start</span>' +
    '<h1 style="margin-top:8px">' + esc(g.name) + '</h1>' +
    '<div class="codebig">' + esc(g.code) + '</div>' +
    '<p class="muted" style="font-size:0.84rem">Ca ' + g.duration_min + ' min · ' + S.data.missions.length + ' uppdrag som slumpas ut längs vägen.</p>' +
    '<div style="margin-top:12px"><button class="btn ghost" data-action="share" data-url="' + esc(url) + '">Dela länken</button></div>' +
  '</div>';

  if (!joined) {
    html += '<div class="card stack" id="joinbox">' +
      '<h2>Vem är du?</h2>' +
      '<input type="text" id="j-name" placeholder="Ditt namn" autocomplete="off">' +
      '<h3 style="margin-top:6px">Välj lag</h3>' +
      '<div id="teamlist">' + teamListHtml(true) + '</div>' +
      '<h3>… eller starta ett nytt lag</h3>' +
      '<input type="text" id="j-teamname" placeholder="Lagnamn" autocomplete="off">' +
      '<label class="field">Lagbild (valfritt)</label>' +
      '<div class="avatarpicker">' +
        '<div class="avatarpreview" id="avatarpreview">' + (S._teamAvatarPreviewUrl ? '<img src="' + S._teamAvatarPreviewUrl + '" alt="">' : ICONS.camera) + '</div>' +
        '<label class="btn ghost small" style="position:relative">Lägg till lagbild' +
          '<input type="file" accept="image/*" style="position:absolute; inset:0; opacity:0" onchange="onTeamAvatarPicked(this)">' +
        '</label>' +
      '</div>' +
      '<button class="btn" data-action="create-team">Skapa laget och gå med</button>' +
    '</div>';
  } else {
    var me = playerById(S.playerId);
    var t = teamById(S.teamId);
    html += '<div class="card center">' +
      '<p>Du är med som <strong>' + esc(me.name) + '</strong> i lag ' + teamAvatarHtml(t, 22) + ' <strong>' + esc(t.name) + '</strong></p>' +
    '</div>';
    html += '<div class="card"><h2>Lagen</h2><div id="teamlist">' + teamListHtml(false) + '</div></div>';
  }

  if (ph.name === "prestart") {
    html += '<div class="card center">' +
      '<span class="label">Startar om</span>' +
      '<div class="countpill" id="cd-main" style="margin-top:6px">' + fmtClock(g.started_at - now()) + '</div>' +
    '</div>';
  } else if (isHost) {
    var nPlayers = S.data.players.length;
    html += '<div class="card stack center">' +
      '<p class="muted">' + nPlayers + ' spelare i ' + S.data.teams.length + ' lag hittills.</p>' +
      '<button class="btn" data-action="start-game">Starta jakten</button>' +
    '</div>';
  } else {
    html += '<p class="center muted" style="margin-top:18px"><span class="dotpulse"></span>Spelledaren startar jakten snart …</p>';

function teamListHtml(clickable) {
  if (!S.data.teams.length) {
    return '<p class="muted">Inga lag än – skapa det första nedan.</p>';
  }
  return S.data.teams.map(function (t) {
    var members = S.data.players
      .filter(function (p) { return p.team_id === t.id; })
      .map(function (p) { return esc(p.name); }).join(", ");
    var attrs = clickable
      ? ' data-action="join-team" data-team="' + t.id + '" style="cursor:pointer"'
      : "";
    return '<div class="teamrow"' + attrs + '>' +
      teamAvatarHtml(t, 40) +
      '<div><strong>' + esc(t.name) + '</strong><div class="members">' + (members || "tomt än") + '</div></div>' +
      (clickable ? '<span style="margin-left:auto" class="pill">Gå med</span>' : "") +
    '</div>';
  }).join("");
}

/* ---------- game ---------- */
function renderGame(ph) {
  var html = "";
  if (S.tab === "mission") html = missionTabHtml(ph);
  else if (S.tab === "gallery") html = galleryTabHtml(ph);
  else html = scoreTabHtml(ph);

  html += tabsHtml(ph);
  show(html);
}

function tabsHtml(ph) {
  function b(id, icon, label) {
    return '<button data-action="tab" data-tab="' + id + '" class="' + (S.tab === id ? "on" : "") + '">' +
      ICONS[icon] + label + '</button>';
  }
  return '<div class="tabs">' +
    b("mission", "camera", "Uppdrag") +
    b("gallery", "photos", "Bilder") +
    b("score", "trophy", "Topplista") +
  '</div>';
}

function headerHtml(ph) {
  var t = S.teamId ? teamById(S.teamId) : null;
  return '<div class="row" style="padding-top:8px; padding-right:52px">' +
    '<strong>' + esc(G().name) + '</strong>' +
    (t ? '<span style="margin-left:auto" class="pill">' + teamAvatarHtml(t, 18) + ' ' + esc(t.name) + '</span>' : "") +
  '</div>';
}

function missionTabHtml(ph) {
  var html = headerHtml(ph);
  var m, subs, c, mp;

  if (ph.name === "await") {
    html += '<div class="card center" style="padding:38px 20px 34px">' +
      '<div class="radar"><div class="core">' + ICONS.camera + '</div></div>' +
      '<h2>Jakten är igång</h2>' +
      '<p class="muted" style="margin-top:8px">Första uppdraget kan dyka upp när som helst – håll telefonen redo.</p>' +
    '</div>';
  }

  else if (ph.name === "submit") {
    m = S.data.missions[ph.idx];
    mp = mParts(m.title);
    var left = closeAt(ph.idx) - now();
    var total = subMs();
    var pct = Math.max(0, Math.min(100, (left / total) * 100));
    var mine = subsFor(m.id).filter(function (s) { return s.team_id === S.teamId; })[0];

    html += '<div class="card missioncard">' +
      '<span class="label">Uppdrag ' + (ph.idx + 1) + " av " + nMissions() + '</span>' +
      (mp.icon ? '<div class="micon" style="margin-top:14px">' + mp.icon + '</div>' : "") +
      '<div class="mtitle">' + esc(mp.text) + '</div>' +
      '<div class="progressbar"><div id="pbar" style="width:' + pct + '%"></div></div>' +
      '<div class="countpill" id="cd-main" style="margin-top:12px">' + fmtClock(left) + '</div>' +
      '<p class="muted">kvar att fota och skicka in</p>' +
    '</div>';

    if (!S.playerId) {
      html += '<div class="card center"><p class="muted">Du är inte med i ett lag – gå med via startsidan.</p></div>';
    } else if (S.uploading) {
      html += '<div class="card center"><p><span class="spin"></span>Laddar upp bilden …</p></div>';
    } else if (mine) {
      var uploader = playerById(mine.player_id);
      html += '<div class="card center">' +
        '<p><strong>Lagets bild är inne</strong></p>' +
        '<p class="muted" style="margin-top:2px">Skickad av ' + esc(uploader.name) + '</p>' +
        '<div class="mysubmit" data-action="zoom" data-path="' + esc(mine.photo_path) + '"><img src="' + BUCKET_PUB + esc(mine.thumb_path) + '" alt=""></div>' +
        '<div class="row" style="margin-top:14px; justify-content:center">' +
          cameraBtnHtml(m.id, "Byt bild", true) +
          '<button class="btn danger small" data-action="remove-photo" data-mission="' + m.id + '">Ta bort</button>' +
        '</div>' +
      '</div>';
    } else {
      html += '<div class="card center">' + cameraBtnHtml(m.id, "Ta bilden", false) + '<p class="muted" style="margin-top:12px">Vem som helst i laget kan skicka in åt laget.</p></div>';
    }
    html += othersProgressHtml(m);
  }

  else if (ph.name === "vote") {
    m = S.data.missions[ph.idx];
    mp = mParts(m.title);
    subs = anonSort(subsFor(m.id));
    var vleft = voteEndAt(ph.idx) - now();
    var mv = myVote(m.id);
    html += '<div class="card missioncard" style="padding-bottom:18px">' +
      '<span class="label">Rösta – uppdrag ' + (ph.idx + 1) + '</span>' +
      '<div class="mtitle" style="margin-top:10px">' + esc(mp.text) + '</div>' +
      '<div class="countpill" id="cd-main" style="margin-top:10px">' + fmtClock(vleft) + '</div>' +
      '<p class="muted">Rösta på den bästa bilden – inte på ert eget lag.</p>' +
    '</div>';

    if (!subs.length) {
      html += '<div class="card center"><p class="muted">Inga bilder kom in på det här uppdraget.</p></div>';
    } else {
      html += '<div class="photogrid">' + subs.map(function (s) {
        var own = S.teamId && teamOfSub(s) === S.teamId;
        var sel = (S.votePick[m.id] || mv) === s.id;
        return '<div class="photocell' + (own ? " own" : "") + (sel && !own ? " sel" : "") + '"' +
          ' data-action="' + (own ? "zoom" : "pick-vote") + '" data-sub="' + s.id + '" data-mission="' + m.id + '" data-path="' + esc(s.photo_path) + '">' +
          '<img src="' + BUCKET_PUB + esc(s.thumb_path) + '" alt="" loading="lazy">' +
          (own ? '<div class="tag">Ert lag</div>' : "") +
        '</div>';
      }).join("") + '</div>';
      var pickId = S.votePick[m.id];
      if (pickId && pickId !== mv) {
        html += '<div style="margin-top:14px"><button class="btn" data-action="send-vote" data-mission="' + m.id + '">Rösta</button></div>';
      } else if (mv) {
        html += '<p class="center muted" style="margin-top:12px">Din röst är inne – du kan ändra dig tills tiden går ut.</p>';
      } else {
        html += '<div class="center"><span class="nextstep">' + ICONS.check + 'Tryck på en bild för att välja den</span></div>';
      }
    }
  }

  else if (ph.name === "done") {
    html += '<div class="card center" style="padding:34px 20px">' +
      '<div class="iconbadge"><svg class="ic" viewBox="0 0 24 24" style="width:36px; height:36px"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6.2"/></svg></div>' +
      '<h2>Alla uppdrag är klara</h2>' +
      '<p class="muted" style="margin-top:8px">Samla ihop er – snart är det dags för prisutdelningen.</p>' +
    '</div>';
    if (S.hostKey) {
      html += '<div class="card stack center"><button class="btn" data-action="end-game">Starta prisutdelningen</button></div>';
    } else {
      html += '<p class="center muted"><span class="dotpulse"></span>Spelledaren startar prisutdelningen …</p>';
    }
  }

  else if (ph.name === "finale") {
    html += '<div class="card center"><h2>Prisutdelning</h2>' +
      '<button class="btn" data-action="open-finale" style="margin-top:14px">Visa prisutdelningen</button></div>';
  }

  if (S.hostKey && (ph.name === "submit" || ph.name === "vote")) {
    html += '<div class="center" style="margin-top:22px"><button class="btn danger" data-action="end-game">Avsluta jakten i förtid …</button></div>';
  }
  return html;
}

function cameraBtnHtml(missionId, label, small) {
  return '<label class="btn' + (small ? " ghost small" : "") + '" style="position:relative">' +
    (small ? "" : ICONS.camera.replace('class="ic"', 'class="ic" style="display:inline-block; vertical-align:-5px; margin-right:9px; width:21px; height:21px"')) + label +
    '<input type="file" accept="image/*" capture="environment" data-mission="' + missionId + '"' +
    ' style="position:absolute; inset:0; opacity:0" onchange="onPhotoPicked(this)">' +
  '</label>';
}

function othersProgressHtml(m) {
  var subs = subsFor(m.id);
  var total = S.data.teams.length;
  return '<p class="center muted" style="margin-top:16px">' + subs.length + " av " + total + ' lag har skickat in</p>';
}

/* ---------- gallery tab ---------- */
function galleryTabHtml(ph) {
  var html = headerHtml(ph) + '<h2 style="margin-top:16px">Tidigare uppdrag</h2>';
  var past = S.data.missions.filter(function (m) {
    return G().started_at && voteEndAt(m.idx) <= now();
  });
  if (!past.length) {
    return html + '<div class="card center"><p class="muted">Inget färdigröstat uppdrag än – kom tillbaka efter första omröstningen.</p></div>';
  }
  past.slice().reverse().forEach(function (m) {
    var w = missionWinners(m);
    var c = voteCounts(m.id);
    var mp = mParts(m.title);
    html += '<div class="card">' +
      '<span class="label">Uppdrag ' + (m.idx + 1) + '</span>' +
      '<h3 style="margin-top:4px">' + esc(mp.text) + '</h3>';
    if (!subsFor(m.id).length) {
      html += '<p class="muted">Inga bilder.</p>';
    } else {
      html += '<div class="photogrid">' + subsFor(m.id).map(function (s) {
        var p = playerById(s.player_id);
        var t = teamById(s.team_id);
        var isWin = w.votes > 0 && w.winners.some(function (x) { return x.id === s.id; });
        return '<div class="photocell" data-action="zoom" data-path="' + esc(s.photo_path) + '" data-cap="' + esc(t.name + " – " + p.name) + '">' +
          '<img src="' + BUCKET_PUB + esc(s.thumb_path) + '" alt="" loading="lazy">' +
          ((c[s.id] || 0) > 0 ? '<div class="votetag">' + (c[s.id] || 0) + '</div>' : "") +
          '<div class="tag">' + teamAvatarHtml(t, 15) + ' ' + esc(p.name) + '</div>' +
        '</div>';
      }).join("") + '</div>';
    }
    html += '</div>';
  });
  return html;
}

/* ---------- score tab ---------- */
function scoreTabHtml(ph) {
  var sc = scores();
  var html = headerHtml(ph) + '<h2 style="margin-top:16px">Topplista</h2><div class="card">';
  if (!sc.length) html += '<p class="muted">Inga lag än.</p>';
  sc.forEach(function (row, i) {
    html += '<div class="scorerow">' +
      '<span class="pos">' + (i + 1) + '</span>' +
      teamAvatarHtml(row.team, 32) +
      '<strong>' + esc(row.team.name) + '</strong>' +
      '<span class="pts">' + row.pts + " p</span>" +
    '</div>';
  });
  html += '</div><p class="muted center" style="margin-top:12px">Poäng = röster på lagets bilder. Uppdateras efter varje avslutad omröstning.</p>';
  return html;
}

/* ---------- mission drop + submit effects ---------- */
function dropSeen(mid) {
  if (MEMFLAGS.drop[mid]) return true;
  try { return localStorage.getItem("fotojakt:drop:" + mid) === "1"; } catch (e) { return true; }
}
function markDrop(mid) {
  MEMFLAGS.drop[mid] = true;
  try { localStorage.setItem("fotojakt:drop:" + mid, "1"); } catch (e) {}
}
function missionDropFx(m) {
  var mp = mParts(m.title);
  var d = document.createElement("div");
  d.className = "dropfx";
  d.innerHTML = '<div class="dicon">' + (mp.icon || ICONS.camera) + '</div>' +
    '<span class="label dlabel">Nytt uppdrag</span>' +
    '<div class="dtitle">' + esc(mp.text) + '</div>';
  d.addEventListener("click", function () { d.remove(); });
  document.body.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.remove(); }, 2600);
  sndMission();
  buzz([180, 70, 180, 70, 320]);
}
function maybeDropFx() {
  if (VIEW !== "game" || !S.data || !G().started_at || S.finaleOpen) return;
  if (el("ovl").firstChild) return;
  var ph = phase();
  if (ph.name !== "submit") return;
  var m = S.data.missions[ph.idx];
  if (dropSeen(m.id)) return;
  markDrop(m.id);
  missionDropFx(m);
}
function showCheckFx() {
  var d = document.createElement("div");
  d.className = "checkfx";
  d.innerHTML = '<div class="badgewrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6.2"/></svg></div>';
  document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 1100);
}
function burstConfetti(ms) {
  startConfetti();
  var mySession = confettiSession;
  setTimeout(function () {
    if (confettiSession === mySession) stopConfetti();
  }, ms);
}

/* ---------- reveal overlay ---------- */
function maybeShowReveal() {
  if (VIEW !== "game" || !S.data || !G().started_at) return;
  if (S.finaleOpen) return;
  var ph = phase();
  if (ph.name === "finale") return;
  for (var i = 0; i < nMissions(); i++) {
    var m = S.data.missions[i];
    if (voteEndAt(i) <= now() && !seenReveal(m.id) && subsFor(m.id).length > 0) {
      showRevealOverlay(m);
      return;
    }
    if (voteEndAt(i) <= now() && subsFor(m.id).length === 0) markReveal(m.id);
  }
}

function showRevealOverlay(m) {
  if (S._revealFor === m.id && el("ovl").firstChild) return;
  S._revealFor = m.id;
  var mp0 = mParts(m.title);
  showOvl(
    '<div class="overlay" id="reveal-stage"><div class="inner center" style="padding-top:16vh">' +
      '<span class="label">Resultat · Uppdrag ' + (m.idx + 1) + '</span>' +
      '<h2 style="margin-top:6px">' + esc(mp0.text) + '</h2>' +
      '<div class="drumdots"><span></span><span></span><span></span></div>' +
      '<p class="muted">Rösterna räknas …</p>' +
    '</div></div>'
  );
  sndDrum();
  buzz([40, 40, 40, 40, 40]);
  setTimeout(function () {
    if (S._revealFor !== m.id || S.finaleOpen || !el("reveal-stage")) return;
    renderRevealResult(m);
  }, 1400);
}

function renderRevealResult(m) {
  var w = missionWinners(m);
  var c = voteCounts(m.id);
  var mp = mParts(m.title);
  if (w.votes > 0) { sndWin(); buzz([60, 40, 60, 40, 160]); burstConfetti(1800); }
  var html = '<div class="overlay"><div class="inner center revealin">' +
    '<span class="label" style="padding-top:10px">Resultat · Uppdrag ' + (m.idx + 1) + '</span>' +
    '<h2 style="margin-top:6px">' + esc(mp.text) + '</h2>';

  if (w.votes === 0) {
    html += '<p class="muted" style="margin-top:12px">Inga röster den här gången – alla bilder finns under ”Bilder”.</p>';
  } else {
    w.winners.forEach(function (s) {
      var p = playerById(s.player_id);
      var t = teamById(s.team_id);
      html += '<div class="card">' +
        '<span class="label">Vinnare</span>' +
        '<div class="mysubmit" data-action="zoom" data-path="' + esc(s.photo_path) + '" data-cap="' + esc(t.name) + '"><img src="' + BUCKET_PUB + esc(s.photo_path) + '" alt=""></div>' +
        '<h3 style="margin-top:12px">' + teamAvatarHtml(t, 22) + ' ' + esc(t.name) + " – " + esc(p.name) + '</h3>' +
        '<p class="muted">' + w.votes + (w.votes === 1 ? " röst" : " röster") + (w.winners.length > 1 ? " · delad seger" : "") + '</p>' +
      '</div>';
    });
  }
  var others = subsFor(m.id).filter(function (s) {
    return !(w.votes > 0 && w.winners.some(function (x) { return x.id === s.id; }));
  });
  if (others.length) {

/* ---------- finale ---------- */
function finaleSlides() {
  var slides = [{ type: "intro" }];
  S.data.missions.forEach(function (m) {
    if (subsFor(m.id).length > 0) slides.push({ type: "mission", m: m });
  });
  var sc = scores();
  if (sc.length >= 3) slides.push({ type: "podium", pos: 3, row: sc[2] });
  if (sc.length >= 2) slides.push({ type: "podium", pos: 2, row: sc[1] });
  if (sc.length >= 1) slides.push({ type: "winner", row: sc[0], tied: sc.length > 1 && sc[1].pts === sc[0].pts });
  slides.push({ type: "table", sc: sc });
  return slides;
}

function openFinale() {
  if (S.finaleOpen || S.finaleClosed) return;
  S.finaleOpen = true;
  S._revealFor = null;
  S.finaleStep = 0;
  renderFinale();
}

function renderFinale() {
  var slides = finaleSlides();
  if (S.finaleStep >= slides.length) S.finaleStep = slides.length - 1;
  var sl = slides[S.finaleStep];

      html += '<p style="opacity:0.7; margin-top:14px">Inga röster – men bilderna finns under ”Bilder”.</p>';
    } else {
      w.winners.forEach(function (s) {

          '<div style="display:flex; align-items:center; justify-content:center; gap:10px">' + teamAvatarHtml(t, 24) + '<strong>' + esc(t.name) + '</strong> – ' + esc(p.name) +
          ' · ' + w.votes + (w.votes === 1 ? " röst" : " röster") + '</div>';

    }
  } else if (sl.type === "podium") {
    html += '<div class="bignum">' + sl.pos + '</div>' +
      '<span class="label" style="margin-top:10px">Plats ' + sl.pos + '</span>' +
      '<div class="wname">' + teamAvatarHtml(sl.row.team, 44) + " " + esc(sl.row.team.name) + '</div>' +
      '<p style="opacity:0.75; font-variant-numeric:tabular-nums">' + sl.row.pts + " poäng</p>";
  } else if (sl.type === "winner") {
    html += '<div class="iconbadge gold" style="width:88px; height:88px; margin-bottom:0">' +
        ICONS.trophy.replace('class="ic"', 'class="ic" style="width:40px; height:40px; color:#3A2A08"') +
      '</div>' +
      '<h2 style="margin-top:16px">' + (sl.tied ? "Delad seger" : "Vinnare") + '</h2>' +
      '<div class="wname" style="filter:drop-shadow(0 0 26px rgba(198,150,58,.55))">' + teamAvatarHtml(sl.row.team, 92) + '</div>' +
      '<div class="wname" style="margin-top:10px">' + esc(sl.row.team.name) + '</div>' +
      '<p style="opacity:0.85; font-size:1.15rem; font-variant-numeric:tabular-nums">' + sl.row.pts + " poäng</p>";
  } else if (sl.type === "table") {

/* ---------- confetti ---------- */
var confettiRAF = null;
var confettiSession = 0;
function startConfetti() {
  stopConfetti();
  confettiSession++;
  var cv = document.createElement("canvas");
  cv.id = "confetti";
  document.body.appendChild(cv);
  var ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  var colors = ["#6DC77C", "#4E9E5F", "#E8E3D4", "#F2D48A", "#2F6B3E", "#FFFFFF"];
  var parts = [];
  for (var i = 0; i < 130; i++) {
    parts.push({
      x: Math.random() * cv.width,
      y: -20 - Math.random() * cv.height,
      w: 6 + Math.random() * 6,
      h: 10 + Math.random() * 8,
      c: colors[Math.floor(Math.random() * colors.length)],
      vy: 2 + Math.random() * 3,
      vx: -1 + Math.random() * 2,
      r: Math.random() * Math.PI,
      vr: -0.1 + Math.random() * 0.2
    });
  }
  function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(function (p) {
      p.y += p.vy; p.x += p.vx; p.r += p.vr;
      if (p.y > cv.height + 30) { p.y = -30; p.x = Math.random() * cv.width; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    confettiRAF = requestAnimationFrame(frame);
  }
  frame();
}
function stopConfetti() {
  if (confettiRAF) cancelAnimationFrame(confettiRAF);
  confettiRAF = null;
  var cv = document.getElementById("confetti");
  if (cv) cv.remove();
}

    })

}
window.onPhotoPicked = onPhotoPicked;

function onTeamAvatarPicked(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  if (S._teamAvatarPreviewUrl) URL.revokeObjectURL(S._teamAvatarPreviewUrl);
  S._teamAvatarFile = file;
  S._teamAvatarPreviewUrl = URL.createObjectURL(file);
  var prev = el("avatarpreview");
  if (prev) prev.innerHTML = '<img src="' + S._teamAvatarPreviewUrl + '" alt="">';
}
window.onTeamAvatarPicked = onTeamAvatarPicked;

function clearTeamAvatarPick() {
  if (S._teamAvatarPreviewUrl) URL.revokeObjectURL(S._teamAvatarPreviewUrl);
  S._teamAvatarFile = null;
  S._teamAvatarPreviewUrl = null;
}

function uploadTeamAvatar(file) {
  return loadImageFromFile(file).then(function (o) {
    return scaleToJpeg(o.img, 400, 0.8).then(function (blob) {
      URL.revokeObjectURL(o.url);
      var path = G().id + "/teams/" + Math.floor(now()) + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
      return putObject(path, blob).then(function () { return path; });
    });
  });
}

function loadImageFromFile(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { res({ img: img, url: url }); };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("Kunde inte läsa bilden")); };
    img.src = url;
  });
}

function scaleToJpeg(img, maxDim, quality) {
  var w = img.naturalWidth, h = img.naturalHeight;
  var scale = Math.min(1, maxDim / Math.max(w, h));
  var cw = Math.round(w * scale), ch = Math.round(h * scale);
  var cv = document.createElement("canvas");
  cv.width = cw; cv.height = ch;
  cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
  return new Promise(function (res, rej) {
    cv.toBlob(function (b) {
      if (b) res(b); else rej(new Error("Bildkonvertering misslyckades"));
    }, "image/jpeg", quality);
  });
}

function downloadPhoto(path) {
  toast("Laddar ner …", 1500);
  fetch(BUCKET_PUB + path).then(function (r) {
    if (!r.ok) throw new Error("nedladdning misslyckades");
    return r.blob();
  }).then(function (blob) {
    var objUrl = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = objUrl;
    a.download = "fotojakten-" + path.split("/").pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(objUrl); }, 4000);
  }).catch(function () {
    toast("Kunde inte ladda ner – tryck och håll på bilden istället", 3500);
  });
}

function putObject(path, blob) {
  return fetch(BUCKET + path, {
    method: "POST",
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type": "image/jpeg",
      "cache-control": "public, max-age=31536000"
    },
    body: blob
  }).then(function (r) {
    if (!r.ok) {
      return r.text().then(function (t) {
        throw new Error("nekades av servern (" + r.status + ")");
      });
    }
  });
}

function compressAndUpload(file, missionId) {
  return loadImageFromFile(file).then(function (o) {
    return Promise.all([
      scaleToJpeg(o.img, 1280, 0.78),
      scaleToJpeg(o.img, 380, 0.72)
    ]).then(function (blobs) {
      URL.revokeObjectURL(o.url);
      var base = G().id + "/" + missionId + "/" + S.teamId + "-" + Math.floor(now());
      var photoPath = base + ".jpg";
      var thumbPath = base + "_t.jpg";
      return putObject(photoPath, blobs[0])
        .then(function () { return putObject(thumbPath, blobs[1]); })
        .then(function () {
          return api("submit_photo", {
            p_mission_id: missionId,
            p_player_id: S.playerId,
            p_photo_path: photoPath,
            p_thumb_path: thumbPath
          });
        });
    });
  });
}

/* ================= POLL / TICK ================= */
var pollSeq = 0;
function poll() {
  if (!S.code) return Promise.resolve();
  var mySeq = ++pollSeq;
  return api("get_state", { p_code: S.code }).then(function (d) {
    if (mySeq !== pollSeq) return;
    S.offset = d.now - Date.now();
    S.data = d;
    var sig = computeSig();
    if (sig !== S.lastSig) {
      S.lastSig = sig;
      if (VIEW === "lobby" || VIEW === "game") {
        syncViewToPhase();
        renderOrPatch();
      }
    }
    maybeShowReveal();
    maybeDropFx();
  }).catch(function (e) {
    /* network hiccup on a walk - stay calm, keep polling */
  });
}

function computeSig() {
  var ph = phase();
  var voteSig = hashStr(S.data.votes.map(function (v) {
    return v.mission_id + v.voter_player_id + v.submission_id;
  }).sort().join("|"));
  var subSig = hashStr(S.data.submissions.map(function (s) {
    return s.mission_id + s.team_id + s.photo_path;
  }).sort().join("|"));
  return [
    ph.name, ph.idx,
    S.data.teams.length, S.data.players.length,
    subSig, voteSig,
    G().started_at, G().ended_at, S.uploading
  ].join("|");
}

function syncViewToPhase() {
  var ph = phase();
  if (ph.name === "lobby" || ph.name === "prestart") VIEW = "lobby";
  else VIEW = "game";
}

function renderOrPatch() {
  var active = document.activeElement;
  var typing = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
  if (typing && VIEW === "lobby") {
    var tl = el("teamlist");
    if (tl) tl.innerHTML = teamListHtml(!S.playerId);
    return;
  }
  render();
}

function tick() {
  if (!S.data || !G()) return;
  var ph = phase();
  var sig = computeSig();
  if (sig !== S.lastSig) {
    S.lastSig = sig;
    syncViewToPhase();
    renderOrPatch();
    maybeShowReveal();
    maybeDropFx();
    return;
  }
  var cd = el("cd-main");
  if (cd) {
    var left = 0;
    if (ph.name === "prestart") left = G().started_at - now();
    else if (ph.name === "submit") left = closeAt(ph.idx) - now();
    else if (ph.name === "vote") left = voteEndAt(ph.idx) - now();
    cd.textContent = fmtClock(left);
    var warn = left < 31000;
    cd.classList.toggle("warn", warn);
    var pbar0 = document.querySelector(".progressbar");
    if (pbar0) pbar0.classList.toggle("warn", warn);
    if (ph.name === "submit" && left > 0 && left <= 10500) {
      var sec = Math.ceil(left / 1000);
      if (S._lastTickSec !== sec) { S._lastTickSec = sec; sndTick(); }
    }
  }
  var pb = el("pbar");
  if (pb && ph.name === "submit") {
    var pct = Math.max(0, Math.min(100, ((closeAt(ph.idx) - now()) / subMs()) * 100));
    pb.style.width = pct + "%";
  }
}

/* ================= ACTIONS ================= */
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-action]");
  if (!t) return;
  var a = t.getAttribute("data-action");

  if (a === "goto-create") { clearTeamAvatarPick(); VIEW = "create"; render(); }
  else if (a === "goto-home") { clearTeamAvatarPick(); VIEW = "home"; render(); }

  else if (a === "join-code") {
    var code = el("joincode").value.trim().toUpperCase();
    if (code.length < 3) return toast("Skriv in spelkoden");
    enterGame(code);
  }

  else if (a === "dur-step") {
    var span = el("c-duration");
    var v = Math.max(15, Math.min(480, (parseInt(span.textContent, 10) || 60) + parseInt(t.getAttribute("data-d"), 10)));
    span.textContent = v;
    [].forEach.call(document.querySelectorAll("#durchips button"), function (b) {
      b.classList.toggle("sel", parseInt(b.getAttribute("data-v"), 10) === v);
    });
  }

  else if (a === "dur-set") {
    el("c-duration").textContent = t.getAttribute("data-v");
    [].forEach.call(document.querySelectorAll("#durchips button"), function (b) {
      b.classList.toggle("sel", b === t);
    });
  }

  else if (a === "create-game") {
    var name = el("c-name").value.trim() || "Fotojakten";
    var duration = parseInt(el("c-duration").textContent, 10) || 60;
    var submit = parseInt(el("c-submit").value, 10) || 3;
    var missions = shuffled(DEFAULT_MISSIONS);
    // same rule as the server: each mission needs a slot of submit + 2 min inside (duration - 2 min warmup)
    if ((duration * 60 - 120) / missions.length < submit * 60 + 120) {
      var needMin = Math.ceil((missions.length * (submit * 60 + 120) + 120) / 60);
      return toast("För kort. " + missions.length + " uppdrag med " + submit + " min fototid behöver minst " + needMin + " min – öka tiden eller korta fototiden", 5000);
    }
    t.disabled = true;
    api("create_game", { p_name: name, p_duration_min: duration, p_submit_min: submit, p_missions: missions })
      .then(function (r) {
        S.code = r.code;
        S.hostKey = r.host_key;
        S.playerId = null; S.teamId = null;
        saveLocal();
        history.replaceState(null, "", "?g=" + r.code);
        return enterGame(r.code);
      })
      .catch(function (e) { t.disabled = false; toast(e.message, 4000); });
  }

  else if (a === "create-team") {
    var pname = el("j-name").value.trim();
    var tname = el("j-teamname").value.trim();
    if (!pname) return toast("Skriv ditt namn först");
    if (!tname) return toast("Vad ska laget heta?");
    t.disabled = true;
    var avatarFile = S._teamAvatarFile;
    (avatarFile ? uploadTeamAvatar(avatarFile) : Promise.resolve(null))
      .then(function (avatarPath) {
        return api("create_team", { p_game_id: G().id, p_name: tname, p_avatar_path: avatarPath });
      })
      .then(function (teamId) {
        return api("join_team", { p_team_id: teamId, p_name: pname }).then(function (pid) {
          S.playerId = pid; S.teamId = teamId; saveLocal();
          clearTeamAvatarPick();
          return poll().then(render);
        });
      })
      .catch(function (e) { t.disabled = false; toast(e.message, 4000); });
  }

  else if (a === "join-team") {
    var pname2 = el("j-name").value.trim();
    if (!pname2) return toast("Skriv ditt namn först");
    var teamId = t.getAttribute("data-team");
    api("join_team", { p_team_id: teamId, p_name: pname2 })
      .then(function (pid) {
        S.playerId = pid; S.teamId = teamId; saveLocal();
        return poll().then(render);
      })
      .catch(function (e) { toast(e.message, 4000); });
  }

  else if (a === "share") {
    var url = t.getAttribute("data-url");
    if (navigator.share) {
      navigator.share({ title: "Fotojakten", text: "Häng med på Fotojakten – kod: " + S.code, url: url }).catch(function () {});
    } else {
      navigator.clipboard.writeText(url).then(function () { toast("Länken kopierad"); });
    }
  }

  else if (a === "start-game") {
    if (!S.data.players.length) return toast("Vänta tills någon gått med");
    t.disabled = true;
    api("start_game", { p_game_id: G().id, p_host_key: S.hostKey })
      .then(poll)
      .catch(function (e) { t.disabled = false; toast(e.message, 4000); });
  }

  else if (a === "end-game") {
    if (!confirm("Avsluta jakten och gå till prisutdelningen?")) return;
    api("end_game", { p_game_id: G().id, p_host_key: S.hostKey })
      .then(poll)
      .catch(function (e) { toast(e.message, 4000); });
  }

  else if (a === "tab") {
    S.tab = t.getAttribute("data-tab");
    render();
  }

  else if (a === "pick-vote") {
    var mid = t.getAttribute("data-mission");
    S.votePick[mid] = t.getAttribute("data-sub");
    render();
  }

  else if (a === "send-vote") {
    var mid2 = t.getAttribute("data-mission");
    var subId = S.votePick[mid2];
    if (!subId) return;
    t.disabled = true;
    api("cast_vote", { p_mission_id: mid2, p_voter_player_id: S.playerId, p_submission_id: subId })
      .then(function () {
        delete S.votePick[mid2];
        toast("Rösten är inne");
        sndVote();
        buzz(35);
        return poll().then(render);
      })
      .catch(function (e) { t.disabled = false; toast(e.message, 4000); });
  }

  else if (a === "remove-photo") {
    if (!confirm("Ta bort lagets bild för det här uppdraget?")) return;
    var midR = t.getAttribute("data-mission");
    t.disabled = true;
    api("remove_photo", { p_mission_id: midR, p_player_id: S.playerId })
      .then(function () { return poll().then(render); })
      .catch(function (e) { t.disabled = false; toast(e.message, 4000); });
  }

  else if (a === "zoom") {
    var path = t.getAttribute("data-path");
    var cap = t.getAttribute("data-cap") || "";
    var lb = document.createElement("div");
    lb.className = "lightbox";
    lb.innerHTML = '<img src="' + BUCKET_PUB + esc(path) + '" alt="">' +
      (cap ? '<div class="cap">' + esc(cap) + '</div>' : "") +
      '<button type="button" class="btn ghost dlbtn" data-action="download-photo" data-path="' + esc(path) + '">Ladda ner</button>' +
      '<p class="hint">Fungerar det inte? Tryck och håll på bilden.</p>' +
      '<div class="cap" style="opacity:0.4; font-weight:400; font-size:0.82rem; margin-top:14px">Tryck utanför för att stänga</div>';
    lb.addEventListener("click", function (ev2) {
      if (ev2.target.closest('[data-action="download-photo"]')) return;
      lb.remove();
    });
    document.body.appendChild(lb);
  }

  else if (a === "download-photo") {
    downloadPhoto(t.getAttribute("data-path"));
  }

  else if (a === "close-reveal") {
    markReveal(t.getAttribute("data-mission"));
    S._revealFor = null;
    stopConfetti();
    showOvl("");
    maybeShowReveal();
    maybeDropFx();
  }

  else if (a === "toggle-sound") {
    setMuted(!isMuted());
    if (!isMuted()) sndVote();
  }

  else if (a === "open-finale") { S.finaleClosed = false; openFinale(); }

  else if (a === "finale-next") {
    if (ev.target.closest("[data-action='zoom']")) return;
    var slides = finaleSlides();
    if (S.finaleStep >= slides.length - 1) {
      S.finaleOpen = false;
      S.finaleClosed = true;
      stopConfetti();
      showOvl("");
      render();
    } else {
      S.finaleStep++;
      renderFinale();
    }
  }
});

document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") {
    var lb = document.querySelector(".lightbox");
    if (lb) { lb.remove(); return; }
  }
  if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
  var t = document.activeElement;
  if (!t || !t.hasAttribute || !t.hasAttribute("data-action")) return;
  var tag = t.tagName;
  if (tag === "BUTTON" || tag === "A" || tag === "LABEL" || tag === "INPUT") return;
  ev.preventDefault();
  t.click();
});

/* ================= BOOT ================= */
function enterGame(code) {
  S.code = code;
  var saved = loadLocal(code);
  if (saved) {
    S.playerId = saved.playerId || null;
    S.teamId = saved.teamId || null;
    S.hostKey = saved.hostKey || null;
  }
  return api("get_state", { p_code: code }).then(function (d) {
    S.offset = d.now - Date.now();
    S.data = d;
    S.lastSig = computeSig();
    if (S.playerId && !S.data.players.some(function (p) { return p.id === S.playerId; })) {
      S.playerId = null; S.teamId = null;
    }
    /* fresh device joining mid-game: skip the reveal/drop backlog for long-finished missions */
    if (G().started_at) {
      S.data.missions.forEach(function (m) {
        if (voteEndAt(m.idx) <= now() && !seenReveal(m.id)) { markReveal(m.id); markDrop(m.id); }
      });
    }
    history.replaceState(null, "", "?g=" + code);
    syncViewToPhase();
    render();
    maybeShowReveal();
    maybeDropFx();
    if (!S.polling) S.polling = setInterval(poll, 5000);
    if (!S.ticking) S.ticking = setInterval(tick, 1000);
    requestWake();
  }).catch(function (e) {
    toast(e.message, 4000);
    VIEW = "home";
    render();
  });
}

function requestWake() {
  try {
    if (navigator.wakeLock) {
      navigator.wakeLock.request("screen").catch(function () {});
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") {
    poll();
    requestWake();
  }
});

/* boot disabled in preview */

</script>
